<!DOCTYPE html>
{% load static %}
<html lang="{{ current_language|default:'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}basecms{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <style>
      body { min-height: 100vh; display: flex; flex-direction: column; }
      main { flex: 1; }
      .cms-content img { max-width: 100%; height: auto; }
      .block-card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem; background: #fff; }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    {% include "basecms/includes/header.html" %}
    {% include "basecms/includes/navbar.html" %}
    <main>{% block content %}{% endblock %}</main>
    {% include "basecms/includes/footer.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
