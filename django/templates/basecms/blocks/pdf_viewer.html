<div class="block-card"><h3 class="h6">PDF</h3>{% for att in attachments %}{% if att.media_asset and att.media_asset.source_url %}<iframe src="{{ att.media_asset.source_url }}" class="w-100" style="height: 70vh;"></iframe>{% elif att.external_url %}<iframe src="{{ att.external_url }}" class="w-100" style="height: 70vh;"></iframe>{% endif %}{% empty %}<div class="text-muted">No PDF attachment.</div>{% endfor %}</div>
