# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — basecms-django + basecms-cockpit proxy
#
# The public website is now its own deployment (basecms-site repo).
# This nginx only handles:
#   /assets/          → Vite-hashed cockpit JS/CSS (baked into image)
#   /cockpit/         → React cockpit SPA (baked into image)
#   /static/          → Django collectstatic output (volume)
#   /media/           → Django user uploads (volume)
#   /api/             → Django REST API (proxied)
#   /accounts/        → Django auth (proxied)
#   /admin/           → Django admin (proxied)
#   /<lang>/<slug>/data/  → Django public JSON API (proxied)
#   /<lang>/<slug>/   → Django public page (django-mode template rendering)
#   /                 → Django home
#
# CORS note: if the public site is on a different domain (e.g. example.com)
# and this runs on cms.example.com, add CORS headers on the /api/public/
# location below so the browser SPA can fetch data cross-origin.
# ─────────────────────────────────────────────────────────────────────────────

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;

    upstream django {
        server django:8000;
    }

    server {
        listen 80;

        location /cockpit/ {
            alias /usr/share/nginx/html/cockpit/;
            try_files $uri $uri/ /cockpit/index.html;
            add_header Cache-Control "no-store";
        }

        location /cockpit/assets/ {
            alias /usr/share/nginx/html/cockpit/assets/;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }

        location /assets/ {
            alias /usr/share/nginx/html/site/assets/;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }

        location /static/ {
            alias /app/static/;
        }

        location /media/ {
            alias /app/media/;
        }

        location ~ ^/(api|accounts|admin)/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ "^/[a-z]{2}/[^/]+/data/$" {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health/ {
            return 200 "ok";
        }

        location / {
            alias /usr/share/nginx/html/site/;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store";
        }
    }
}